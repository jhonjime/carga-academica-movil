# ─────────────────────────────────────────────────────────────────────────────
#  Genera el APK de Android automáticamente en la nube (GitHub Actions).
#
#  Se ejecuta cada vez que se sube código a main/master, o manualmente desde
#  la pestaña "Actions" → "Generar APK Android" → "Run workflow".
#  El APK queda descargable en la sección "Artifacts" de la ejecución.
#  Si se crea un tag (ej. v1.0.0) también se publica como Release.
# ─────────────────────────────────────────────────────────────────────────────
name: Generar APK Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java 21 (requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web (SvelteKit → build/)
        run: npm run build

      - name: Copiar la app web al proyecto Android (Capacitor)
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CargaAcademica.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CargaAcademica-APK
          path: CargaAcademica.apk
          retention-days: 30

      - name: Publicar Release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CargaAcademica.apk
