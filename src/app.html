<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0f3460" />
        <meta name="color-scheme" content="light" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="mobile-web-app-capable" content="yes" />
        <link rel="icon" type="image/png" href="%sveltekit.assets%/icono.png" />

        <!--
            Bootstrap, Bootstrap Icons y DataTables ya NO se cargan desde CDN:
            se instalan con npm y se empaquetan con la app (ver src/routes/+layout.svelte).
            Así la app móvil abre rápido y su interfaz funciona aunque la señal sea débil.
        -->

        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
